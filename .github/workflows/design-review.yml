name: Design review
on:
  push:
    branches: [design/premium-earthworks]
permissions:
  contents: read
concurrency:
  group: design-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: npm ci
      - name: Source and palette tests
        run: node --test tests/*.test.mjs
      - name: Build Astro site (no publication)
        run: npm run build
      - name: Install isolated browser review dependency
        run: npm install --prefix "$RUNNER_TEMP/design-browser" --no-save --package-lock=false playwright@1.57.0
      - name: Review built site with loaded photo and fonts
        env:
          NODE_PATH: ${{ runner.temp }}/design-browser/node_modules
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/design-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ -o /dev/null && break || sleep 1; done
          node scripts/browser-review.cjs
      - name: Save screenshots and review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-review-${{ github.sha }}
          path: design-review-results/
          if-no-files-found: warn
          retention-days: 7
